<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vyntyra Connect - Admin Login</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            theme: {
                extend: {

                        "on-primary": "#002e6a",

                        "on-primary-fixed": "#001a42",
                        "on-error": "#690005",
                        "surface-tint": "#adc6ff",
                        "on-tertiary": "#502400",
                        "surface-variant": "#2d3449",
                        "tertiary": "#ffb786",
                        "primary": "#adc6ff",
                        "secondary-fixed": "#f0dbff",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#2c0051",
                        "surface-container-low": "#131b2e",

                        "secondary": "#ddb7ff",

                        "primary-fixed": "#d8e2ff",

                        "on-primary-fixed-variant": "#004395",

                        "primary-fixed-dim": "#adc6ff",

                        "on-background": "#dae2fd",

                        "inverse-surface": "#dae2fd",

                        "tertiary-fixed-dim": "#ffb786",
                        "outline": "#8c909f",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "full": "9999px"
                    },
                    "spacing": {

                        "gutter": "24px",
                        "container-max": "1280px",
                        "margin-desktop": "64px",

                    "fontFamily": {
                        "label-md": ["Inter"],

<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- Ambient Background Effects -->
<div class="absolute inset-0 pointer-events-none z-0">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[120px] mix-blend-screen"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-secondary/10 rounded-full blur-[150px] mix-blend-screen"></div>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop z-10">
<!-- Glassmorphic Login Card -->
<div class="w-full max-w-md bg-surface/40 backdrop-blur-xl border border-white/10 rounded-xl p-8 shadow-2xl relative overflow-hidden">
<!-- Subtle Top Highlight -->
<div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold text-primary tracking-tight mb-2">Vyntyra Connect</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Admin Access</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2 relative">
<label class="font-label-md text-label-md text-on-surface-variant block uppercase tracking-wider" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-white/5 border-b border-white/10 focus:border-primary focus:ring-0 rounded-t-DEFAULT pl-10 pr-4 py-3 text-on-surface font-body-md text-body-md transition-all placeholder:text-on-surface-variant/50 focus:bg-white/10" id="email" placeholder="admin@vyntyra.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2 relative">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block uppercase tracking-wider" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-white/5 border-b border-white/10 focus:border-primary focus:ring-0 rounded-t-DEFAULT pl-10 pr-12 py-3 text-on-surface font-body-md text-body-md transition-all placeholder:text-on-surface-variant/50 focus:bg-white/10" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-DEFAULT hover:bg-primary-container hover:shadow-[0_0_20px_rgba(173,198,255,0.2)] transition-all active:scale-[0.98] mt-4 flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
</main>
<!-- Shared Footer Component (Modified for Auth Screen Context) -->
<footer class="fixed bottom-0 w-full bg-transparent flex flex-col md:flex-row justify-between items-center px-margin-mobile md:px-margin-desktop py-8 gap-4 opacity-60 z-10 pointer-events-none">
<!-- Brand Logo Hidden as per JSON -->
<div class="hidden">Vyntyra Connect</div>
<div class="font-body-sm text-body-sm text-on-surface-variant text-center md:text-left flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">security</span>
            Protected by Enterprise Grade Security
        </div>
<div class="flex gap-4 font-body-sm text-body-sm text-on-surface-variant pointer-events-auto">
<a class="hover:text-primary transition-all cursor-pointer" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-all cursor-pointer" href="#">Terms of Service</a>
<a class="hover:text-primary transition-all cursor-pointer" href="#">Security Whitepaper</a>
</div>
</footer>
</body></html>
